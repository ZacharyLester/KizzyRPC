name: Build AAR

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build AAR
        run: ./gradlew :KizzyRPC:assembleRelease
        
      - name: Upload AAR
        uses: actions/upload-artifact@v3
        with:
          name: KizzyRPC
          path: KizzyRPC/build/outputs/aar/KizzyRPC-release.aar