name: Build AAR

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: List tasks
        run: ./gradlew :KizzyRPC:tasks
        
      - name: Build AAR
        run: ./gradlew assembleRelease
        
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: KizzyRPC
          path: "**/build/outputs/aar/*.aar"